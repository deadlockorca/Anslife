<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Factory background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f879f"/>
      <stop offset="0.45" stop-color="#5f7893"/>
      <stop offset="1" stop-color="#4d6681"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa0b6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d7e1ea" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="700" fill="url(#bg)"/>

  <g filter="url(#softBlur)" opacity="0.42">
    <rect x="90" y="130" width="230" height="170" rx="8" fill="#a7bacd"/>
    <rect x="350" y="110" width="280" height="185" rx="8" fill="#9eb4c9"/>
    <rect x="670" y="100" width="340" height="205" rx="8" fill="#9ab1c8"/>
    <rect x="1040" y="120" width="250" height="180" rx="8" fill="#a6b7ca"/>
    <rect x="1320" y="145" width="180" height="150" rx="8" fill="#9bb0c5"/>

    <rect x="130" y="340" width="160" height="130" rx="8" fill="#8ea6be"/>
    <rect x="330" y="325" width="220" height="145" rx="8" fill="#89a2bd"/>
    <rect x="590" y="310" width="270" height="160" rx="8" fill="#8ca4bd"/>
    <rect x="900" y="320" width="190" height="150" rx="8" fill="#90a7c0"/>
    <rect x="1125" y="315" width="240" height="155" rx="8" fill="#879fba"/>
    <rect x="1390" y="330" width="150" height="130" rx="8" fill="#8ea5be"/>
  </g>

  <g opacity="0.22" fill="#dfe9f4">
    <circle cx="150" cy="70" r="7"/>
    <circle cx="210" cy="82" r="6"/>
    <circle cx="320" cy="62" r="7"/>
    <circle cx="450" cy="78" r="6"/>
    <circle cx="560" cy="68" r="8"/>
    <circle cx="720" cy="80" r="6"/>
    <circle cx="860" cy="62" r="7"/>
    <circle cx="1010" cy="74" r="6"/>
    <circle cx="1180" cy="65" r="7"/>
    <circle cx="1310" cy="82" r="6"/>
    <circle cx="1450" cy="68" r="7"/>
  </g>

  <rect y="500" width="1600" height="200" fill="url(#floor)"/>
  <rect y="0" width="1600" height="700" fill="#3a4f66" opacity="0.2"/>
</svg>
